<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryan's Repair | Handyman & Mechanical Services | Morgan Hill, CA</title>
    <style>
        :root {
            --bg-slate: #384652;
            --bg-darker: #2b3640;
            --bg-card: #2f3d48;
            --text-white: #ffffff;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-cyan-hover: #0284c7;
            --border-slate: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-slate);
            color: var(--text-light);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        /* Top Navigation Header */
        header {
            background-color: var(--bg-darker);
            border-bottom: 2px solid var(--border-slate);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 20px;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-text h1 {
            font-size: 1.3rem;
            color: var(--text-white);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .brand-text p {
            font-size: 0.78rem;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--accent-cyan);
        }

        .nav-btn {
            background-color: var(--accent-cyan);
            color: #0f172a !important;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 700 !important;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 15px;
        }

        /* Business Card Replica Banner */
        .card-showcase {
            background-color: var(--bg-card);
            border: 2px solid var(--border-slate);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 35px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 25px;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .card-info h2 {
            font-size: 2rem;
            color: var(--text-white);
            margin-bottom: 2px;
            letter-spacing: 1px;
        }

        .card-info .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .card-details p {
            font-size: 0.95rem;
            margin-bottom: 4px;
            color: var(--text-light);
        }

        .card-details strong {
            color: var(--accent-cyan);
        }

        .card-logo-right {
            text-align: center;
            padding: 10px;
        }

        /* Section Styling */
        .section-header {
            text-align: center;
            margin: 40px 0 20px 0;
        }

        .section-header h2 {
            color: var(--text-white);
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--accent-cyan);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* 6 Grid Services Layout */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .service-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-slate);
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .service-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-3px);
        }

        .service-card h3 {
            color: var(--text-white);
            font-size: 1.2rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .service-card ul {
            list-style: none;
        }

        .service-card li {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            padding-left: 16px;
            position: relative;
        }

        .service-card li::before {
            content: "•";
            color: var(--accent-cyan);
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        /* Info Twin Grid (Locations & Hours) */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .info-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-slate);
            border-radius: 10px;
            padding: 20px;
        }

        .info-card h3 {
            color: var(--accent-cyan);
            margin-bottom: 12px;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-card ul {
            list-style: none;
        }

        .info-card li {
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        /* Quote Request Form Section */
        .quote-container {
            background-color: var(--bg-darker);
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
        }

        .quote-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .form-full {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-slate);
            border: 1px solid var(--border-slate);
            border-radius: 6px;
            color: var(--text-white);
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-cyan);
